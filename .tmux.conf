# prefixキーをC-spaceに変更する
set -g prefix C-space

# デフォルトのprefixキーを解除する
unbind C-b
unbind -n C-Left
unbind -n C-Down
unbind -n C-Right
unbind -n C-Up

#Broadcast Imput
bind b set-window-option synchronize-panes

# prefix+\でペインを垂直分割する
bind ^ split-window -h

# prefix+-でペインを水平分割する
bind - split-window -v

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ペインをリサイズする
bind Left resize-pane -L 1
bind Down resize-pane -D 1
bind Up resize-pane -U 1
bind Right resize-pane -R 1

# ウィンドウを切り替える
bind -n S-left previous-window
bind -n S-right next-window

set-option -g mouse on

bind-key -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"

bind-key -n WheelDownPane select-pane -t= \; send-keys -M

# 256色モードを有効にする
set-option -g default-terminal screen-256color
set -g terminal-overrides 'xterm:colors=256'

# ステータスラインの色を変更
setw -g status-style fg=colour255,bg=colour234

# status-leftを非表示にする
set -g status-left ""

# status-rightを非表示にする
set -g status-right ""

# window-statusを右寄せにする
set -g status-justify right

# windowのインデックスを1から始める
set -g base-index 1

# window-statusの見た目を変更
setw -g window-status-current-format '#[bg=colour2,fg=colour255] #I #W '
setw -g window-status-format '#[fg=colour242] #I #W '

setw -g window-status-current-format '#[bg=colour2,fg=colour255]#{?client_prefix,#[bg=colour3],} #I #W '

# prefix+r で設定のリロード
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# コピーモードのキーバインディングをvi風に
set-window-option -g mode-keys vi


