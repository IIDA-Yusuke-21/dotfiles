# Rio configuration for WSL.
#
# Rio itself runs on the Windows side, so it cannot follow a symlink into the
# WSL filesystem. Copy this file by hand:
#   cp .config/rio/config.d/wsl.toml \
#      "$(wslpath "$(cmd.exe /c 'echo %LOCALAPPDATA%' 2>/dev/null | tr -d '\r')")/rio/config.toml"
#
# See the full configuration reference: https://rioterm.com/docs

confirm-before-quit = true

[shell]
program = "wsl.exe"
args = ["~"]

[navigation]
# タブ関連のデフォルトキーバインドを無効化
mode = "Plain"

[env]
TERM = "xterm-256color"

[fonts]
# ASCII は Rio 既定の Cascadia Code のまま、日本語の範囲だけ BIZ UDGothic に
# 割り当てる。BIZ UDGothic は Windows にプリインストールされた等幅フォントで、
# 全角が半角の正確に2倍幅になる。
#
# U+2000-U+2E7F（罫線、■●▲、①②、→）は意図的に含めない。East Asian
# Ambiguous 幅の文字なので日本語フォントに振ると全角幅で描かれ、tmux のペイン
# 境界や Neovim の UI が崩れる。Rio は use-drawable-chars（既定で true）で
# 罫線を自前描画するため、既定のままにしておく。
symbol-map = [
  { start = "3000", end = "30FF", font-family = "BIZ UDGothic" }, # 記号・ひらがな・カタカナ
  { start = "4E00", end = "9FFF", font-family = "BIZ UDGothic" }, # 漢字
  { start = "FF00", end = "FFEF", font-family = "BIZ UDGothic" }, # 全角英数・半角カナ
]

[bindings]
keys = [
  # 有効にするキーバインド
  { key = "-", with = "control", action = "DecreaseFontSize" },
  { key = ";", with = "control | shift", action = "IncreaseFontSize" },

  # 以下、Windows版Rioのデフォルトキーバインドを解除
  { key = ",",     with = "control | shift", action = "ReceiveChar" },
  { key = "space", with = "control | shift", action = "ReceiveChar" },
# { key = "c",     with = "control | shift", action = "ReceiveChar" },
# { key = "v",     with = "control | shift", action = "ReceiveChar" },
  { key = "n",     with = "control | shift", action = "ReceiveChar" },
  { key = "t",     with = "control | shift", action = "ReceiveChar" },
  { key = "tab", with = "control",         action = "ReceiveChar" },
  { key = "tab", with = "control | shift", action = "ReceiveChar" },
  { key = "]",   with = "control | shift", action = "ReceiveChar" },
  { key = "[",   with = "control | shift", action = "ReceiveChar" },
  { key = "0", with = "control",         action = "ReceiveChar" },
  { key = "w", with = "control | shift", action = "ReceiveChar" },
  { key = "1", with = "control | shift", action = "ReceiveChar" },
  { key = "2", with = "control | shift", action = "ReceiveChar" },
  { key = "3", with = "control | shift", action = "ReceiveChar" },
  { key = "4", with = "control | shift", action = "ReceiveChar" },
  { key = "5", with = "control | shift", action = "ReceiveChar" },
  { key = "6", with = "control | shift", action = "ReceiveChar" },
  { key = "7", with = "control | shift", action = "ReceiveChar" },
  { key = "8", with = "control | shift", action = "ReceiveChar" },
  { key = "9", with = "control | shift", action = "ReceiveChar" },
  { key = "f", with = "control | shift", action = "ReceiveChar" },
  { key = "b", with = "control | shift", action = "ReceiveChar" },
  { key = "r", with = "control | shift", action = "ReceiveChar" },
  { key = "d", with = "control | shift", action = "ReceiveChar" },
  { key = "up",    with = "control | shift | alt", action = "ReceiveChar" },
  { key = "down",  with = "control | shift | alt", action = "ReceiveChar" },
  { key = "left",  with = "control | shift | alt", action = "ReceiveChar" },
  { key = "right", with = "control | shift | alt", action = "ReceiveChar" },
  { key = "p", with = "control | shift", action = "ReceiveChar" },
]
