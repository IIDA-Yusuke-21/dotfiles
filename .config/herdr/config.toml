onboarding = false
[ui]
agent_panel_sort = "priority"
prompt_new_tab_name = false
pane_borders = true
pane_gaps = false
right_click_passthrough_modifier = "ctrl"
mobile_width_threshold = 64

show_agent_labels_on_pane_borders = true
[ui.toast]
delivery = "herdr"
delay_seconds = 1

[terminal]
new_cwd = "follow"

[theme]
name = "dracula"
auto_switch = false

[worktrees]
directory = "~/.herdr/worktrees"

[keys]
prefix = "ctrl+space"
detach = "prefix+d"
reload_config = "prefix+r"
resize_mode = ""
split_vertical = "prefix+^"
focus_pane_left = "alt+h"
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
focus_pane_right = "alt+l"
previous_tab = "alt+shift+h"
next_tab = "alt+shift+l"

[[keys.command]]
key = "prefix+p"
type = "pane"
command = "bash"
description = "open bash"

[experimental]
pane_history = true
switch_ascii_input_source_in_prefix = false

[session]
resume_agents_on_restore = false

[update]
channel = "stable"
version_check = true
manifest_check = true
